[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-operator-model"
version = "2.0.0"
description = "Portable Ascend operator latency and resource estimates for system simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
operator-sim = "operator_model.__main__:main"

[project.urls]
Repository = "https://github.com/Runze-Lin/operator_sim"

[tool.setuptools.packages.find]
where = ["src"]
include = ["operator_model", "operator_model.*"]
namespaces = false

[tool.setuptools.package-data]
operator_model = ["data/chips/*.json", "data/parameters/*.json"]
