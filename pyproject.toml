[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-operator-model"
version = "0.25.0"
description = "Per-device Ascend operator latency estimates for system simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["operator_model*"]

[project.scripts]
operator-sim = "operator_model.__main__:main"
